<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>贪心 · 35岁生日</title><style>*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:#121522;color:#f8ebd7;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.card{width:min(88vw,380px);padding:42px 30px;border:1px solid #9d805453;border-radius:22px;text-align:center;background:#202331;box-shadow:0 25px 60px #0007}h1{font-size:28px;font-weight:500;margin:0 0 16px}p{color:#c5b598;line-height:1.7}input,button{width:100%;font:inherit;border-radius:10px;padding:14px;margin-top:14px}input{background:#121522;color:white;border:1px solid #9d8054}button{background:#b79259;color:#151515;border:0;font-weight:700;cursor:pointer}#msg{min-height:24px;font-size:13px;color:#f4b19f}</style></head><body><main class="card"><h1>贪心，生日快乐</h1><p>输入邀请密码，打开这份生日纪念。</p><form id="form"><input id="password" type="password" aria-label="邀请密码" placeholder="邀请密码" autocomplete="off" required><button id="submit" type="submit">打开纪念</button></form><p id="msg" role="status"></p></main><script>
const salt="pHHLXGaBO3SM7Kx8C02Fyg==",iv="WAe6AUasew1s/GF9",rounds=250000;
const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
document.getElementById('form').addEventListener('submit',async event=>{
 event.preventDefault();const password=document.getElementById('password').value,button=document.getElementById('submit'),message=document.getElementById('msg');button.disabled=true;button.textContent='正在打开…';message.textContent='正在加载生日内容，请稍等。';
 try{
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(salt),iterations:rounds,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const response=await fetch('./birthday.bin');if(!response.ok)throw new Error('fetch');
  const encrypted=await response.arrayBuffer();message.textContent='正在打开生日纪念…';
  const content=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(iv)},key,encrypted);
  const page=new TextDecoder().decode(content);document.open();document.write(page);document.close();
 }catch(error){message.textContent=error.message==='fetch'?'内容文件尚未上传或网络加载失败，请稍后重试。':'密码不正确，或网络下载尚未完成，请重试。';button.disabled=false;button.textContent='打开纪念'}
});</script></body></html>
